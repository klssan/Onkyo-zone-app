name: WireGuard preview checks
on:
  push:
    branches: [feature/remote-wireguard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/remote-wireguard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: JVM regression and retry tests
        run: |
          mkdir -p /tmp/onkyo-tests
          javac -d /tmp/onkyo-tests app/src/main/java/at/local/dualzone/{Protocol,Receiver,Discovery,Capabilities,Diagnostics,Scene,SceneExecutor,WidgetStatus,RetryPolicy,RadioControl}.java tests/*.java
          for t in Protocol Receiver Discovery Capabilities Diagnostics WireReplay Scene WidgetStatus Volume RetryPolicy RadioControl; do java -cp /tmp/onkyo-tests at.local.dualzone.${t}Test; done
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 tests/run_android_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: Onkyo-dahoam-wireguard-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish verified preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" Onkyo-dahoam-v0.8.0-preview.3.apk
          gh release create v0.8.0-preview.3 Onkyo-dahoam-v0.8.0-preview.3.apk --target "${{ github.sha }}" --prerelease --title "Onkyo dahoam 0.8.0 VPN + Radio preview 3" --notes "Preview only. JVM and emulator checks passed; actual FRITZ!Box/VPN, LTE switching and Android widget background behavior require real-device testing. Temporary debug signature; uninstall may be required. Radio 3×2 and universal volume 2×1; initial FM zone volume 45."
