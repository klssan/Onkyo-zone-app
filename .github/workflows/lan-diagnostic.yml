name: LAN-only installation diagnostic
on:
  push:
    branches: [diagnostic/lan-only]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    if: github.ref == 'refs/heads/diagnostic/lan-only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: JVM tests
        run: |
          mkdir -p /tmp/onkyo-tests
          javac -d /tmp/onkyo-tests app/src/main/java/at/local/dualzone/{Protocol,Receiver,Discovery,Capabilities,Diagnostics,Scene,SceneExecutor,WidgetStatus,RetryPolicy,RadioControl}.java tests/*.java
          for t in Protocol Receiver Discovery Capabilities Diagnostics WireReplay Scene WidgetStatus Volume RetryPolicy RadioControl; do java -cp /tmp/onkyo-tests at.local.dualzone.${t}Test; done
      - run: gradle --no-daemon assembleDebug
      - name: Verify isolation and APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='at.local.dualzone'"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert not any(n.startswith('lib/') for n in z.namelist()), 'Unexpected native library'
              assert not any(b'com/wireguard' in z.read(n) for n in z.namelist() if n.endswith('.dex')), 'Unexpected WireGuard code'
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 tests/ui_smoke.py
      - name: Publish temporary diagnostic APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.8.4-lan-beta.${GITHUB_RUN_NUMBER}"
          APK="Onkyo-dahoam-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --title "Onkyo dahoam $TAG (installation diagnostic)" --notes "Temporary debug signing, no WireGuard or native libraries, Redesigned LAN dashboard, compact inactive zones, contextual controls and integrated audio options. JVM, package verification and Android UI smoke checks passed. Diagnostic only; not a permanent update baseline. LAN only."
