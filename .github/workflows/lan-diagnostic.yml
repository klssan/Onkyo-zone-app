name: LAN-only installation diagnostic
on:
  push:
    branches: [diagnostic/lan-only]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    if: github.ref == 'refs/heads/diagnostic/lan-only'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: JVM tests
        run: |
          mkdir -p /tmp/onkyo-tests
          javac -d /tmp/onkyo-tests app/src/main/java/at/local/dualzone/{Protocol,Receiver,Discovery,Capabilities,Diagnostics,Scene,SceneExecutor,WidgetStatus,RetryPolicy,RadioControl}.java tests/*.java
          for t in Protocol Receiver Discovery Capabilities Diagnostics WireReplay Scene WidgetStatus Volume RetryPolicy RadioControl; do java -cp /tmp/onkyo-tests at.local.dualzone.${t}Test; done
      - run: gradle --no-daemon assembleDebug
      - name: Verify isolation and APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='at.local.dualzone'"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert not any(n.startswith('lib/') for n in z.namelist()), 'Unexpected native library'
              assert not any(b'com/wireguard' in z.read(n) for n in z.namelist() if n.endswith('.dex')), 'Unexpected WireGuard code'
          PY
      - name: Publish temporary diagnostic APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.8.3-lan-beta.${GITHUB_RUN_NUMBER}"
          APK="Onkyo-dahoam-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --title "Onkyo dahoam $TAG (installation diagnostic)" --notes "Temporary debug signing, no WireGuard or native libraries, LAN dashboard, early known-device discovery, adaptive status polling, active-only volume, streamlined radio preset changes. JVM and package verification passed; no emulator run. Diagnostic only; not a permanent update baseline. LAN only."
