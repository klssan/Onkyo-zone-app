name: Build debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/onkyo-tests
          javac -d /tmp/onkyo-tests app/src/main/java/at/local/dualzone/{Protocol,Receiver,Discovery,Capabilities,Diagnostics}.java tests/*.java
          java -cp /tmp/onkyo-tests at.local.dualzone.ProtocolTest
          java -cp /tmp/onkyo-tests at.local.dualzone.ReceiverTest
          java -cp /tmp/onkyo-tests at.local.dualzone.DiscoveryTest
          java -cp /tmp/onkyo-tests at.local.dualzone.CapabilitiesTest
          java -cp /tmp/onkyo-tests at.local.dualzone.DiagnosticsTest
          java -cp /tmp/onkyo-tests at.local.dualzone.WireReplayTest
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OnkyoDualZone-v0.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OnkyoDualZone-v0.4-debug
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 tests/ui_smoke.py
