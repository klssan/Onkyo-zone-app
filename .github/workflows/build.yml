name: Build debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/onkyo-tests
          javac -d /tmp/onkyo-tests app/src/main/java/at/local/dualzone/{Protocol,Receiver,Discovery,Capabilities,Diagnostics,Scene,SceneExecutor,WidgetStatus}.java tests/*.java
          java -cp /tmp/onkyo-tests at.local.dualzone.ProtocolTest
          java -cp /tmp/onkyo-tests at.local.dualzone.ReceiverTest
          java -cp /tmp/onkyo-tests at.local.dualzone.DiscoveryTest
          java -cp /tmp/onkyo-tests at.local.dualzone.CapabilitiesTest
          java -cp /tmp/onkyo-tests at.local.dualzone.DiagnosticsTest
          java -cp /tmp/onkyo-tests at.local.dualzone.WireReplayTest
          java -cp /tmp/onkyo-tests at.local.dualzone.SceneTest
          java -cp /tmp/onkyo-tests at.local.dualzone.WidgetStatusTest
          java -cp /tmp/onkyo-tests at.local.dualzone.VolumeTest
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verify APK identity and signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt" dump badging "$APK" > /tmp/apk-info.txt
          cat /tmp/apk-info.txt
          grep -F "package: name='at.local.dualzone' versionCode='11' versionName='0.6.1'" /tmp/apk-info.txt
          grep -F "application-label:'DualZone Remote'" /tmp/apk-info.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/new-cert.txt
          gh api repos/${{ github.repository }}/actions/artifacts/15144810897/zip > /tmp/old.zip
          unzip -p /tmp/old.zip app-debug.apk > /tmp/old.apk
          "$TOOLS/apksigner" verify --print-certs /tmp/old.apk | tee /tmp/old-cert.txt
          if diff <(grep 'certificate SHA-256 digest:' /tmp/new-cert.txt) <(grep 'certificate SHA-256 digest:' /tmp/old-cert.txt); then
            echo "Previous v0.5.1 certificate matches"
          else
            echo "Previous v0.5.1 certificate differs; uninstall older app before installing."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DualZone-Remote-v0.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DualZone-Remote-v0.6.1-ui-test
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DualZone-Remote-v0.6.1-debug
          path: app/build/outputs/apk/debug
      - uses: actions/download-artifact@v4
        with:
          name: DualZone-Remote-v0.6.1-ui-test
          path: app/build/outputs/apk/androidTest/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 tests/run_android_checks.py
  release:
    needs: [apk, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DualZone-Remote-v0.6.1-debug
          path: release
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv release/app-debug.apk release/DualZone-Remote-v0.6.1.apk
          gh release create v0.6.1 release/DualZone-Remote-v0.6.1.apk --target "${{ github.sha }}" --title "DualZone Remote 0.6.1" --notes "Automated JVM, APK identity/signature and Android emulator checks passed. Debug signing may differ from previous versions: uninstall the old app once before installing. Real receiver volume and launcher behavior still require device testing."
